<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3 Kingdom Chibi</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0e120c;
        color: #f4ecd2;
        font-family: Arial, sans-serif;
      }
      #wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 16px 24px;
        box-sizing: border-box;
      }
      h1 {
        margin: 8px 0 4px;
        font-size: 20px;
      }
      .lead {
        margin: 0 0 10px;
        color: #c8d6a3;
        font-size: 13px;
      }
      #play {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        max-width: 1400px;
      }
      #game {
        box-shadow: 0 12px 40px #0008;
      }
      #sidebar {
        width: 420px;
        background: #1a2116;
        border: 1px solid #3d4a30;
        padding: 12px;
        box-sizing: border-box;
        min-height: 400px;
        max-height: 92vh;
        overflow: auto;
      }
      #roster h2,
      #hero-sheet h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      #roster-search,
      #roster-type,
      #roster-sort,
      #map-pick {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 6px;
        padding: 6px;
        background: #11170f;
        color: #f4ecd2;
        border: 1px solid #3d4a30;
      }
      .roster-filters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .roster-list {
        max-height: 200px;
        overflow: auto;
        margin: 8px 0 16px;
      }
      .roster-card {
        display: grid;
        grid-template-columns: 1fr 32px;
        gap: 4px;
        margin-bottom: 6px;
      }
      .roster-card .pick,
      .roster-card .fav {
        border: 1px solid #6a7a50;
        background: #2a3322;
        color: #f4ecd2;
        cursor: pointer;
        text-align: left;
      }
      .roster-card .pick {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px;
        font-size: 12px;
      }
      .roster-card.selected .pick {
        outline: 2px solid #7cff7c;
      }
      .roster-card.deployed .pick {
        background: #3a4a28;
      }
      .roster-card.type-speed .pick {
        border-left: 4px solid #4aa3ff;
      }
      .roster-card.type-damager .pick {
        border-left: 4px solid #e24b4b;
      }
      .roster-card.type-mage .pick {
        border-left: 4px solid #b56bff;
      }
      .roster-card .fav {
        font-size: 18px;
      }
      .check,
      #next-wave,
      #next-wave.visible {
        display: none;
      }
      #roster .muted,
      #shared-bag .muted,
      #friend-dock .muted {
        color: #c8d6a3;
        font-size: 12px;
      }
      #shared-bag h2,
      #friend-dock h2 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      #shared-bag h3 {
        margin: 10px 0 4px;
        font-size: 13px;
        color: #f0d48a;
      }
      .hero-note {
        margin: 0;
        padding: 0 8px 8px;
        color: #c8d6a3;
        font-size: 11px;
      }
      .hero-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 0 8px;
      }
      #hero-sheet .muted {
        color: #c8d6a3;
        font-size: 12px;
      }
      #hero-sheet .warn {
        color: #ffb4b4;
        font-size: 12px;
        margin: 8px 0 0;
      }
      .hero-card {
        background: #140c08;
        border: 3px solid #e6c36a;
        box-shadow: inset 0 0 0 1px #6a3018;
      }
      .hero-card-title {
        background: linear-gradient(#9a1c1c, #6a1010);
        color: #ffe7a0;
        text-align: center;
        font-weight: bold;
        letter-spacing: 0.04em;
        padding: 6px 8px;
        border-bottom: 2px solid #e6c36a;
      }
      .hero-card-body {
        display: grid;
        grid-template-columns: 1fr 148px;
        gap: 8px;
        padding: 8px;
      }
      .hero-stats {
        margin: 0;
      }
      .stat-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        margin-bottom: 4px;
        background: #1c120c;
        border: 1px solid #6a4a22;
        padding: 3px 6px;
        font-size: 12px;
      }
      .stat-row dt {
        color: #f0d48a;
      }
      .stat-row dd {
        margin: 0;
        color: #fff6df;
        font-weight: bold;
      }
      .hero-portrait-wrap {
        position: relative;
        background: radial-gradient(circle at 50% 40%, #3a2418, #120c08 72%);
        border: 1px solid #e6c36a;
        min-height: 188px;
      }
      .hero-portrait {
        display: block;
        width: 148px;
        height: 156px;
        image-rendering: pixelated;
      }
      .hero-nameplate {
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 6px;
        text-align: center;
        background: #1a100cdd;
        border: 1px solid #e6c36a;
        color: #fff6df;
        font-size: 13px;
        font-weight: bold;
        padding: 3px 4px;
      }
      .hero-life {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px 8px;
        font-size: 12px;
        color: #f0d48a;
      }
      .hero-life-bar {
        flex: 1;
        height: 12px;
        background: #2a140c;
        border: 1px solid #e6c36a;
      }
      .hero-life-bar span {
        display: block;
        height: 100%;
        background: linear-gradient(#ffe08a, #e0a020);
      }
      .hero-recall {
        cursor: pointer;
        background: #f0d48a;
        color: #2a140c;
        border: 1px solid #6a4a22;
        font-weight: bold;
        padding: 4px 8px;
      }
      .hero-tabs button {
        cursor: pointer;
        background: #2a1a10;
        color: #f0d48a;
        border: 1px solid #6a4a22;
        padding: 6px 4px;
      }
      .hero-tabs button.on {
        background: #f0d48a;
        color: #2a140c;
        font-weight: bold;
      }
      .hero-panel {
        padding: 8px;
      }
      .slot-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .equip-slot {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        min-height: 52px;
        padding: 6px;
        background: #1c120c;
        color: #fff6df;
        border: 1px solid #6a4a22;
        text-align: left;
      }
      .equip-slot.filled {
        cursor: pointer;
        border-color: #e6c36a;
      }
      .equip-slot:disabled {
        cursor: default;
        opacity: 0.85;
      }
      .equip-slot span,
      .bag-list h3 {
        color: #f0d48a;
        font-size: 11px;
      }
      .equip-slot strong {
        font-size: 12px;
        font-weight: normal;
      }
      .equip-slot i,
      .bag-row i {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 4px;
        border: 1px solid #fff6df;
      }
      .bag-list h3 {
        margin: 8px 0 4px;
        font-size: 13px;
      }
      .bag-row {
        display: block;
        width: 100%;
        margin-bottom: 4px;
        padding: 6px;
        cursor: pointer;
        text-align: left;
        background: #1c120c;
        color: #fff6df;
        border: 1px solid #6a4a22;
        font-size: 12px;
      }
      #inventory {
        display: none;
        position: fixed;
        inset: 0;
        background: #000a;
        z-index: 5;
        align-items: flex-start;
        justify-content: center;
        padding: 32px 16px;
        box-sizing: border-box;
        overflow: auto;
      }
      #inventory.open {
        display: flex;
      }
      .inv-panel {
        width: min(520px, 100%);
        background: #1a2116;
        border: 1px solid #3d4a30;
        padding: 16px;
        box-sizing: border-box;
      }
      .inv-panel h2,
      .inv-panel h3 {
        margin: 12px 0 6px;
      }
      .inv-panel h2 {
        margin-top: 0;
      }
      .inv-panel .muted,
      .inv-panel .stats {
        color: #c8d6a3;
        font-size: 13px;
      }
      .inv-panel ul {
        margin: 6px 0 12px;
        padding-left: 18px;
        font-size: 13px;
      }
      .inv-panel button {
        cursor: pointer;
        border: 1px solid #6a7a50;
        background: #2a3322;
        color: #f4ecd2;
        padding: 6px 8px;
        margin: 0 6px 6px 0;
      }
      #inventory-close {
        background: #7cff7c;
        color: #111;
        font-weight: bold;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <h1>3 Kingdom Chibi</h1>
      <p class="lead">Place heroes, fight a wave, then change formation and gear while paused. Every hero uses the same model — outfit, hair, and weapon tell them apart.</p>
      <div id="play">
        <div id="game"></div>
        <aside id="sidebar">
          <select id="map-pick"></select>
          <label class="check"><input type="checkbox" id="auto-wave" /> Auto next wave</label>
          <button id="next-wave" type="button">Next wave</button>
          <div id="roster"></div>
          <div id="shared-bag" hidden></div>
          <div id="friend-dock" hidden>
            <h2>Friend</h2>
            <p class="muted">No friends are in this battle.</p>
          </div>
          <div id="hero-sheet"></div>
        </aside>
      </div>
      <div id="inventory">
        <div class="inv-panel">
          <h2 id="inventory-title">Spoils</h2>
          <div id="inventory-body"></div>
          <button id="inventory-close" type="button">Close</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
