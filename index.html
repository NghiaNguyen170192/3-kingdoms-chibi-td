<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3 Kingdom Chibi</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0e120c;
        color: #f4ecd2;
        font-family: Arial, sans-serif;
      }
      #wrap {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      h1,
      .lead {
        display: none;
      }
      #play {
        position: relative;
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #sidebar {
        position: static;
        width: 0;
        height: 0;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        overflow: visible;
      }
      #map-pick {
        position: fixed;
        z-index: 6;
        width: auto;
        margin: 0;
        padding: 2px 4px;
        background: #11170f;
        color: #f4ecd2;
        border: 1px solid #3d4a30;
        font-size: 12px;
        pointer-events: auto;
      }
      #map-legend,
      #dock-bar,
      #roster,
      #shared-bag,
      #friend-dock,
      #hero-sheet {
        position: fixed;
        z-index: 6;
        margin: 0;
      }
      #map-legend {
        z-index: 4;
        color: #e8e2c8;
        font-size: 14px;
        line-height: 1.2;
        pointer-events: none;
        text-shadow: 0 1px 0 #000;
      }
      #dock-bar {
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 1px;
        box-sizing: border-box;
        padding: 2px 4px 0;
        pointer-events: none;
      }
      #dock-hud,
      #dock-hint {
        margin: 0;
        line-height: 1.25;
        pointer-events: none;
      }
      #dock-hud {
        color: #f4ecd2;
        font-size: 13px;
      }
      #dock-hint {
        color: #d5e2b8;
        font-size: 12px;
      }
      #dock-buttons {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 2px;
      }
      #dock-left,
      #dock-right {
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: auto;
      }
      #dock-right {
        margin-left: auto;
      }
      #dock-left button,
      #fight-btn {
        margin: 0;
        padding: 3px 8px;
        border: 1px solid #6a4a22;
        background: #1a120c;
        color: #f0d48a;
        font-family: Arial, sans-serif;
        font-size: 13px;
        line-height: 1.2;
        cursor: pointer;
        pointer-events: auto;
      }
      #dock-left button.on {
        background: #e6c36a;
        color: #14200f;
      }
      #fight-btn {
        background: #7cff7c;
        color: #14200f;
        border-color: #2a6a2a;
        font-size: 15px;
        font-weight: bold;
      }
      #fight-btn:disabled {
        opacity: 0.45;
      }
      #roster,
      #shared-bag {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        box-sizing: border-box;
        padding: 2px;
        background: #120c08ee;
        border: 1px solid #6a4a22;
      }
      #roster[hidden],
      #shared-bag[hidden],
      #friend-dock[hidden] {
        display: none;
      }
      #friend-dock {
        width: auto;
        max-width: 240px;
        padding: 4px;
        background: #120c08f2;
        border: 1px solid #6a4a22;
        box-sizing: border-box;
      }
      #auto-dock {
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 2px 4px;
        background: #1a120c;
        border: 1px solid #6a4a22;
        color: #f0d48a;
        font-size: 14px;
        line-height: 1;
        pointer-events: auto;
      }
      #auto-dock input {
        margin: 0;
        width: 14px;
        height: 14px;
      }
      #hero-sheet {
        width: 340px;
        max-height: 70vh;
        overflow: auto;
      }
      #hero-sheet:empty {
        display: none;
      }
      #roster h2,
      #hero-sheet h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .roster-filters {
        display: flex;
        gap: 2px;
        margin: 0;
      }
      .roster-filters select {
        width: auto;
        margin: 0;
        padding: 0 2px;
        background: #11170f;
        color: #f4ecd2;
        border: 1px solid #3d4a30;
        font-size: 11px;
      }
      .roster-list,
      .bag-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, 48px);
        grid-auto-rows: 48px;
        align-content: start;
        gap: 2px;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 98px;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .roster-list {
        grid-template-columns: repeat(auto-fill, 96px);
        grid-auto-rows: 96px;
        height: 194px;
      }
      .roster-card {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0;
        padding: 0;
      }
      .roster-face {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        width: 96px;
        height: 96px;
        margin: 0;
        padding: 0;
        line-height: 0;
        background: #1a120c;
        border: 2px solid #6a7a50;
        cursor: pointer;
      }
      .roster-face canvas {
        display: block;
        width: 80px;
        height: 88px;
        image-rendering: pixelated;
      }
      .roster-card.selected .roster-face {
        outline: 1px solid #fff6df;
        outline-offset: 1px;
      }
      .roster-card .fav {
        position: absolute;
        top: 0;
        right: 0;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: #ffe7a0;
        font-size: 10px;
        line-height: 1;
        cursor: pointer;
      }
      .bag-filters {
        display: flex;
        gap: 2px;
        align-items: center;
      }
      .bag-filters select {
        width: auto;
        margin: 0;
        padding: 0 2px;
        background: #11170f;
        color: #f4ecd2;
        border: 1px solid #3d4a30;
        font-size: 11px;
      }
      .bag-search {
        box-sizing: border-box;
        flex: 1;
        min-width: 0;
        width: auto;
        margin: 0;
        padding: 2px 6px;
        background: #11170f;
        color: #f4ecd2;
        border: 1px solid #3d4a30;
        font-size: 12px;
      }
      .item-face {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        width: 48px;
        height: 48px;
        margin: 0;
        padding: 0;
        line-height: 1.05;
        background: #1a120c;
        color: #fff6df;
        border: 2px solid #c8c8c8;
        cursor: pointer;
      }
      .sprite-icon {
        display: block;
        flex: 0 0 auto;
        background-repeat: no-repeat;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .item-face strong {
        font-size: 9px;
        font-weight: normal;
        color: #f0d48a;
      }
      .loot-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 4px;
      }
      .item-face.worn {
        opacity: 0.4;
      }
      .bag-warn {
        margin: 0 0 0 4px;
        font-size: 11px;
      }
      #roster .muted,
      #shared-bag .muted,
      #friend-dock .muted {
        color: #c8d6a3;
        font-size: 12px;
      }
      .roster-list .muted,
      .bag-list .muted {
        grid-column: 1 / -1;
        margin: 4px;
      }
      #shared-bag h2,
      #friend-dock h2 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      #shared-bag h3 {
        margin: 10px 0 4px;
        font-size: 13px;
        color: #f0d48a;
      }
      .hero-note {
        margin: 0;
        padding: 0 8px 8px;
        color: #c8d6a3;
        font-size: 11px;
      }
      .hero-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 0 8px;
      }
      #hero-sheet .muted {
        color: #c8d6a3;
        font-size: 12px;
      }
      #hero-sheet .warn {
        color: #ffb4b4;
        font-size: 12px;
        margin: 8px 0 0;
      }
      .hero-card {
        background: #140c08;
        border: 3px solid #e6c36a;
        box-shadow: inset 0 0 0 1px #6a3018;
      }
      .hero-card-title {
        background: linear-gradient(#9a1c1c, #6a1010);
        color: #ffe7a0;
        text-align: center;
        font-weight: bold;
        letter-spacing: 0.04em;
        padding: 6px 8px;
        border-bottom: 2px solid #e6c36a;
      }
      .hero-card-body {
        display: grid;
        grid-template-columns: 156px 148px;
        align-items: stretch;
        gap: 6px;
        padding: 6px;
      }
      .hero-portrait-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, #3a2418, #120c08 72%);
        border: 1px solid #e6c36a;
      }
      .hero-portrait {
        display: block;
        width: 148px;
        height: 156px;
        image-rendering: pixelated;
      }
      .hero-nameplate {
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 6px;
        text-align: center;
        background: #1a100cdd;
        border: 1px solid #e6c36a;
        color: #fff6df;
        font-size: 13px;
        font-weight: bold;
        padding: 3px 4px;
      }
      .hero-stats {
        width: 156px;
        margin: 0;
      }
      .stat-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        margin-bottom: 4px;
        background: #1c120c;
        border: 1px solid #6a4a22;
        padding: 3px 6px;
        font-size: 12px;
      }
      .stat-row dt {
        color: #f0d48a;
      }
      .stat-row dd {
        margin: 0;
        color: #fff6df;
        font-weight: bold;
      }
      .hero-life {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px 8px;
        font-size: 12px;
        color: #f0d48a;
      }
      .hero-life-bar {
        flex: 1;
        height: 12px;
        background: #2a140c;
        border: 1px solid #e6c36a;
      }
      .hero-life-bar span {
        display: block;
        height: 100%;
        background: linear-gradient(#ffe08a, #e0a020);
      }
      .hero-recall {
        cursor: pointer;
        background: #f0d48a;
        color: #2a140c;
        border: 1px solid #6a4a22;
        font-weight: bold;
        padding: 4px 8px;
      }
      .hero-tabs button {
        cursor: pointer;
        background: #2a1a10;
        color: #f0d48a;
        border: 1px solid #6a4a22;
        padding: 6px 4px;
      }
      .hero-tabs button.on {
        background: #f0d48a;
        color: #2a140c;
        font-weight: bold;
      }
      .hero-panel {
        padding: 4px 6px;
      }
      .slot-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px;
      }
      .equip-slot {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 4px;
        min-height: 0;
        padding: 2px 4px;
        background: #1c120c;
        color: #fff6df;
        border: 1px solid #6a4a22;
        text-align: left;
      }
      .slot-copy {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .slot-copy strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 108px;
      }
      .equip-slot.filled {
        cursor: pointer;
        border-color: #e6c36a;
      }
      .equip-slot:disabled {
        cursor: default;
        opacity: 0.85;
      }
      .equip-slot span,
      .bag-list h3 {
        color: #f0d48a;
        font-size: 11px;
      }
      .equip-slot strong {
        font-size: 12px;
        font-weight: normal;
      }
      .bag-row i {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 4px;
        border: 1px solid #fff6df;
      }
      .bag-list h3 {
        margin: 8px 0 4px;
        font-size: 13px;
      }
      .bag-row {
        display: block;
        width: 100%;
        margin-bottom: 4px;
        padding: 6px;
        cursor: pointer;
        text-align: left;
        background: #1c120c;
        color: #fff6df;
        border: 1px solid #6a4a22;
        font-size: 12px;
      }
      #inventory {
        display: none;
        position: fixed;
        inset: 0;
        background: #000a;
        z-index: 5;
        align-items: flex-start;
        justify-content: center;
        padding: 32px 16px;
        box-sizing: border-box;
        overflow: auto;
      }
      #inventory.open {
        display: flex;
      }
      .inv-panel {
        width: min(520px, 100%);
        background: #1a2116;
        border: 1px solid #3d4a30;
        padding: 16px;
        box-sizing: border-box;
      }
      .inv-panel h2,
      .inv-panel h3 {
        margin: 12px 0 6px;
      }
      .inv-panel h2 {
        margin-top: 0;
      }
      .inv-panel .muted,
      .inv-panel .stats {
        color: #c8d6a3;
        font-size: 13px;
      }
      .inv-panel ul {
        margin: 6px 0 12px;
        padding-left: 18px;
        font-size: 13px;
      }
      .inv-panel button {
        cursor: pointer;
        border: 1px solid #6a7a50;
        background: #2a3322;
        color: #f4ecd2;
        padding: 6px 8px;
        margin: 0 6px 6px 0;
      }
      #inventory-close {
        background: #7cff7c;
        color: #111;
        font-weight: bold;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <h1>3 Kingdom Chibi</h1>
      <p class="lead">Place heroes, fight a wave, then change formation and gear while paused. Every hero uses the same model — outfit, hair, and weapon tell them apart.</p>
      <div id="play">
        <div id="game"></div>
        <p id="map-legend"></p>
        <div id="dock-bar">
          <p id="dock-hud"></p>
          <p id="dock-hint"></p>
          <div id="dock-buttons">
            <div id="dock-left">
              <button type="button" data-dock="heroes">⚔ HEROES</button>
              <button type="button" data-dock="bag">🎒 BAG</button>
              <button type="button" data-dock="friend">👤 FRIEND</button>
            </div>
            <div id="dock-right">
              <label id="auto-dock" title="Auto next wave"><span>⏩</span><input type="checkbox" id="auto-wave" /></label>
              <button type="button" id="fight-btn">FIGHT</button>
            </div>
          </div>
        </div>
        <aside id="sidebar">
          <select id="map-pick"></select>
          <div id="roster"></div>
          <div id="shared-bag" hidden></div>
          <div id="friend-dock" hidden>
            <h2>Friend</h2>
            <p class="muted">No friends are in this battle.</p>
          </div>
          <div id="hero-sheet"></div>
        </aside>
      </div>
      <div id="inventory">
        <div class="inv-panel">
          <h2 id="inventory-title">Spoils</h2>
          <div id="inventory-body"></div>
          <button id="inventory-close" type="button">Close</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
